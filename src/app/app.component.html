<div class="app-container">
  <!-- Sync Status Indicator -->
  <div class="sync-status-bar bg-blue-50 dark:bg-blue-900/20 px-4 py-1 flex justify-end items-center text-xs border-b border-blue-100 dark:border-blue-800/30 gap-3 transition-all"
       *ngIf="hasPendingSync() || isSyncing() || !isOnline()">
    
    <!-- Offline State -->
    <div *ngIf="!isOnline()" class="flex items-center gap-1 text-red-500">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" /></svg>
      <span>Offline</span>
    </div>

    <!-- Syncing State -->
    <div *ngIf="isOnline() && isSyncing()" class="flex items-center gap-1 text-blue-600 dark:text-blue-400">
      <svg class="w-3 h-3 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
      <span>{{ syncStatus() || 'Syncing...' }}</span>
    </div>

    <!-- Pending State -->
    <div *ngIf="isOnline() && !isSyncing() && hasPendingSync()" class="flex items-center gap-1 text-orange-500">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
      <span>{{ pendingCount() }} changes to sync</span>
    </div>
  </div>
  <header class="desktop-toolbar" *ngIf="isDesktop()">
    <div class="toolbar-left">
      <span class="app-title">Fitness Tracker</span>
    </div>
    <div class="toolbar-actions relative">
      <button
        (click)="toggleMenu()"
        class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
        aria-label="Menu">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>
      <div *ngIf="menuOpen" class="absolute right-0 top-12 bg-white dark:bg-gray-800 rounded-lg shadow-lg py-2 min-w-[200px] z-50">
        <button
          (click)="onExport(); toggleMenu()"
          class="w-full px-4 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          <span>Export Workouts</span>
        </button>
        <button
          (click)="onImport(); toggleMenu()"
          class="w-full px-4 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
          </svg>
          <span>Import Workouts</span>
        </button>
        <div class="border-t border-gray-200 dark:border-gray-700 my-2"></div>
        <button
          (click)="showAbout(); toggleMenu()"
          class="w-full px-4 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-3">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
          <span>About</span>
        </button>
      </div>
    </div>
  </header>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
  <app-bottom-navigation></app-bottom-navigation>
</div>
